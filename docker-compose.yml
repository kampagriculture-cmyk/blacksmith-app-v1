version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: production-db
    environment:
      POSTGRES_USER: kamp
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: production_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: